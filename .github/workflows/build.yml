name: Build and test

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.0.0-SNAPSHOT
      upload_artifact:
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Execute
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - run: mvn -B --no-transfer-progress -Drevision=${{ inputs.version }} clean verify
      - uses: actions/upload-artifact@v7
        if: inputs.upload_artifact
        with:
          name: bot
          path: |
            Dockerfile
            target/*.jar
