name: Pull request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  commitlint:
    name: Lint commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: wagoid/commitlint-github-action@v6
