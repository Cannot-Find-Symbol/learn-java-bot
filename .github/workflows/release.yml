name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.semver.outputs.version_tag }}
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: paulhatch/semantic-version@v5.4.0
        id: semver
        with:
          major_pattern: '/!:|BREAKING CHANGE:/'
          minor_pattern: '/feat(\(.+\))?:/'
          search_commit_body: true

  test:
    name: Build and test
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      upload_artifact: true
    permissions:
      contents: read

  publish:
    needs: [test, version]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bot
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ needs.version.outputs.tag }}
          flavor: latest=true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ needs.version.outputs.tag }}
        run: gh release view "$VERSION_TAG" >/dev/null 2>&1 || gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --generate-notes
