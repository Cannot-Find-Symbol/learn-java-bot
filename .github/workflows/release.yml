name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Build and test
    uses: ./.github/workflows/build.yml
    with:
      upload_artifact: true
    permissions:
      contents: read

  version:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ inputs.tag || steps.semver.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tags
        run: echo "found=$(git tag --list 'v[0-9]*' | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: paulhatch/semantic-version@v5.4.0
        id: semver
        if: github.event_name == 'push' && steps.tags.outputs.found == 'true'

  publish:
    needs: [test, version]
    if: github.ref == 'refs/heads/master' && needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bot
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ needs.version.outputs.tag }}
          flavor: latest=true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ needs.version.outputs.tag }}
        run: gh release view "$VERSION_TAG" >/dev/null 2>&1 || gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --generate-notes
